<!DOCTYPE html>
<html>
  <head>
    <title>My Apps</title>
    <link rel="icon" type="image/x-icon" href="https://pbs.twimg.com/profile_images/1179529603624226818/oGF_v7IC.jpg">
    
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      h2 {
        color: #1a5276;
        margin-bottom: 20px;
      }
      form {
        background-color: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 320px;
      }
      label {
        font-weight: bold;
        display: block;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        resize: none;
      }
      button {
        width: 100%;
        background-color: #2980b9;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 15px;
      }
      button:hover {
        background-color: #1f618d;
      }
    </style>
  </head>
  <body>  

    <h2>Send Us Your Feedback</h2>

    <form action="mailto:oasisgames@ajaxoasis.aleeas.com" method="post" enctype="text/plain">
      <label for="user-feedback">Your Feedback:</label>
      <textarea id="user-feedback" name="FeedbackText" rows="5" placeholder="Please type your feedback here..."></textarea>
      <button type="submit">Submit Feedback</button>
    </form>

  </body>
</html>
